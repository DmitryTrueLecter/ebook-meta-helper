# Production base. On the server it is started as:
#   docker compose up -d
#
# For local development on Windows, layer the local override on top:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# The `web` network is created externally by the Traefik stack on the prod host.
# The `backend` network is internal to this stack and is not reachable from Traefik.

services:
  api:
    image: ebook-meta-helper:latest
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      DB_HOST: mariadb
    volumes:
      - "${HOST_NEW_BOOKS_DIR}:/data/new_books"
      - "${HOST_BOOKS_READY_DIR}:/data/books_ready"
      - "${HOST_DEBUG_DIR:-./debug_logs}:/app/debug_logs"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.ebook-meta-helper.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.ebook-meta-helper.entrypoints=websecure"
      - "traefik.http.routers.ebook-meta-helper.tls.certresolver=letsencrypt"
      - "traefik.http.services.ebook-meta-helper.loadbalancer.server.port=8000"

  watcher:
    image: ebook-meta-helper:latest
    command: ["python", "-u", "run_watcher.py"]
    env_file: .env
    environment:
      DB_HOST: mariadb
    volumes:
      - "${HOST_NEW_BOOKS_DIR}:/data/new_books"
      - "${HOST_BOOKS_READY_DIR}:/data/books_ready"
      - "${HOST_DEBUG_DIR:-./debug_logs}:/app/debug_logs"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${DB_NAME:-ebook_meta}"
      MARIADB_USER: "${DB_USER:-ebook}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  # Shared with the Traefik stack on the prod host. Must already exist:
  #   docker network create web
  web:
    external: true
  # Internal-only: mariadb + watcher + api talk to each other here.
  backend:
    driver: bridge
    internal: false  # api needs egress for OpenAI; flip to true if you ever
                     # move OpenAI calls to a dedicated egress proxy.

volumes:
  mariadb_data:
