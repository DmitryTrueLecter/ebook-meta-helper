name: Contract Drift Gate

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  contract-drift:
    name: Detect contract drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Regenerate OpenAPI contract
        working-directory: apps/backend
        env:
          PYTHONPATH: "."
        run: python scripts/export_openapi.py

      - name: Fail if OpenAPI contract is stale
        working-directory: apps/backend
        run: git diff --exit-code -- contract/openapi.json

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Regenerate frontend types
        working-directory: apps/frontend
        run: npm run gen:types

      - name: Fail if generated types are stale
        working-directory: apps/frontend
        run: git diff --exit-code -- src/types/generated/openapi.ts

      - name: Type-check frontend (contract enforcement)
        working-directory: apps/frontend
        run: npm run type-check
